name: New backlog item
description: Propose a new story. Planned stories live in .github/backlog/backlog.yml.
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: "Planned stories are generated from `.github/backlog/backlog.yml`. Use this form for something new, then the lead will add it to the backlog file."
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: "As a <role>, I want <goal> so that <reason>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: SRS requirement(s)
      placeholder: "FR-6, NFR-3"
