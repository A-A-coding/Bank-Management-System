name: Backlog Sync

# Creates/updates the epics, stories, sprint milestones, labels, assignees and
# Project board from .github/backlog/*.yml. Safe to re-run: existing issues are
# updated in place.

on:
  push:
    branches: [main]
    paths:
      - ".github/backlog/**"
      - ".github/scripts/sync-backlog.js"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: backlog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install js-yaml
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-package-lock js-yaml@4

      - name: Sync backlog
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Classic PAT (scopes: project, repo) stored as a repository secret.
          # Optional: without it the Project board step is skipped.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const yaml = require(`${process.env.RUNNER_TEMP}/deps/node_modules/js-yaml`);
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-backlog.js`);
            await sync({ github, context, core, getOctokit, yaml });
